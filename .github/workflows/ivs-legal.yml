name: IVS Legal CI

on:
  pull_request:
    paths-ignore:
      - 'packages/hugodias.me/**'
      - 'packages/decentralised.dev/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - master
    paths-ignore:
      - 'packages/hugodias.me/**'
      - 'packages/decentralised.dev/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [staging, production]
        default: staging
  repository_dispatch:
    types:
      - ivs-legal-webhook

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  FORCE_COLOR: 1

jobs:
  check:
    name: Check ivs.legal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_TOKEN: ${{ secrets.IVS_NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.IVS_NOTION_DATA_SOURCE_ID }}
      CLOUDFLARE_ENV: ${{ (github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.environment == 'production')) && 'production' || '' }}
      TURNSTILE_SITE_KEY: ${{ (github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.environment == 'production')) && vars.IVS_TURNSTILE_SITE_KEY || vars.IVS_TURNSTILE_STAGING_SITE_KEY }}
      GOOGLE_MAPS: ${{ secrets.GOOGLE_MAPS }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
      - name: Validate Notion configuration
        run: |
          test -n "$NOTION_TOKEN" || { echo '::error::Missing IVS_NOTION_TOKEN'; exit 1; }
          test -n "$NOTION_DATA_SOURCE_ID" || { echo '::error::Missing IVS_NOTION_DATA_SOURCE_ID'; exit 1; }
      - name: Validate Turnstile configuration
        run: test -n "$TURNSTILE_SITE_KEY"
      - run: pnpm --filter ivs.legal types
      - run: pnpm --filter ivs.legal test
      - run: pnpm --filter ivs.legal lint
      - run: pnpm --filter ivs.legal build
      - name: Upload ivs.legal
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
        uses: actions/upload-artifact@v7
        with:
          name: ivs.legal
          path: packages/ivs.legal/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy ivs.legal
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: ivs.legal
          path: packages/ivs.legal/dist
      - name: Deploy to Cloudflare Workers
        working-directory: packages/ivs.legal
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
