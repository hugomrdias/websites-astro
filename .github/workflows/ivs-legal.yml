name: IVS Legal CI

on:
  pull_request:
    paths-ignore:
      - 'packages/hugodias.me/**'
      - 'packages/decentralised.dev/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - master
    paths-ignore:
      - 'packages/hugodias.me/**'
      - 'packages/decentralised.dev/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  repository_dispatch:
    types:
      - ivs-legal-webhook

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  FORCE_COLOR: 1

jobs:
  check:
    name: Check ivs.legal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_TOKEN: ${{ secrets.IVS_NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.IVS_NOTION_DATA_SOURCE_ID }}
      WEB3FORMS: ${{ secrets.WEB3FORMS }}
      HCAPTCHA: ${{ secrets.HCAPTCHA }}
      GOOGLE_MAPS: ${{ secrets.GOOGLE_MAPS }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
      - name: Validate Notion configuration
        run: |
          test -n "$NOTION_TOKEN" || { echo '::error::Missing IVS_NOTION_TOKEN'; exit 1; }
          test -n "$NOTION_DATA_SOURCE_ID" || { echo '::error::Missing IVS_NOTION_DATA_SOURCE_ID'; exit 1; }
      - run: pnpm --filter ivs.legal exec node --test tests/article-schema.test.ts
      - run: pnpm --filter ivs.legal lint
      - run: pnpm --filter ivs.legal build
      - name: Upload ivs.legal
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: ivs.legal
          path: packages/ivs.legal/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy ivs.legal
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: ivs.legal
          path: packages/ivs.legal/dist
      - name: Deploy to Cloudflare Workers
        working-directory: packages/ivs.legal
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
