name: Site

# Checks one site, then deploys it or creates its pull request Preview.
# CI calls this once per affected site, so one site's failure never blocks
# another site's deploy.
on:
  workflow_call:
    inputs:
      site:
        description: Package name
        type: string
        required: true
      environment:
        description: production or preview
        type: string
        required: true
      publish:
        description: Deploy or preview the build after checks pass
        type: boolean
        required: true

permissions:
  contents: read

env:
  CI: true
  FORCE_COLOR: 1
  SITE: ${{ inputs.site }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # turbo passes each package only the variables its turbo.jsonc declares.
      NOTION_TOKEN: ${{ secrets[inputs.site == 'ivs.legal' && 'IVS_NOTION_TOKEN' || 'NOTION_TOKEN'] }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.IVS_NOTION_DATA_SOURCE_ID }}
      GOOGLE_MAPS: ${{ secrets.GOOGLE_MAPS }}
      # Previews use Turnstile's always-pass test key.
      TURNSTILE_SITE_KEY: ${{ inputs.environment == 'preview' && '1x00000000000000000000AA' || vars.IVS_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ inputs.site }}-${{ github.sha }}
          restore-keys: turbo-${{ inputs.site }}-
      - name: Install Playwright Chromium
        if: inputs.site == 'hugodias.me'
        run: pnpm --filter hugodias.me exec playwright install --with-deps chromium
      - name: Lint and test
        run: pnpm turbo run lint test --filter="$SITE"
      # Separate from lint: astro check and astro build both write .astro/.
      - name: Build
        run: pnpm turbo run build --filter="$SITE"
      - name: Upload build
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.site }}
          path: packages/${{ inputs.site }}/dist
          # Keep .well-known/ and ivs.legal's .assetsignore.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: check
    if: inputs.publish && inputs.environment != 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ inputs.site }}-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ inputs.site }}
          path: packages/${{ inputs.site }}/dist
      - name: Deploy to Cloudflare Workers
        working-directory: packages/${{ inputs.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run wrangler:deploy

  preview:
    name: Preview
    needs: check
    if: inputs.publish && inputs.environment == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.site }} preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ inputs.site }}
          path: packages/${{ inputs.site }}/dist
      - id: preview
        name: Create or update Worker Preview
        working-directory: packages/${{ inputs.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
          PREVIEW_MESSAGE: '#${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}'
        run: |
          pnpm run wrangler:preview --name "$PREVIEW_NAME" --message "$PREVIEW_MESSAGE"
          jq -c --arg site "$SITE" 'select(.type == "preview")
            | {site: $site, url: .preview_urls[0], deployment_url: .deployment_urls[0]}' \
            "$WRANGLER_OUTPUT_FILE_PATH" > "$RUNNER_TEMP/preview.json"
          cat "$RUNNER_TEMP/preview.json"
          url=$(jq -r '.url // empty' "$RUNNER_TEMP/preview.json")
          if [ -z "$url" ]; then
            echo "::error::Preview has no URL. Enable preview_urls on the top-level Worker in wrangler.jsonc and deploy that Worker."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-${{ inputs.site }}
          path: ${{ runner.temp }}/preview.json
          retention-days: 1
