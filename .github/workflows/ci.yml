name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      site:
        description: Site to build and deploy
        type: choice
        options: [all, hugodias.me, decentralised.dev, ivs.legal]
        default: all
      environment:
        description: Deployment environment
        type: choice
        options: [production, staging]
        default: production
  # Notion webhook deploys
  repository_dispatch:
    types:
      - webhook
      - ivs-legal-webhook

concurrency:
  # Pull requests cancel stale runs. Other triggers queue in their own group,
  # so a webhook run never replaces a pending push run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event.action || github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  FORCE_COLOR: 1

jobs:
  plan:
    name: Plan
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      sites: ${{ steps.plan.outputs.sites }}
      environment: ${{ steps.plan.outputs.environment }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --affected needs the history between base and head.
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@v3
        with:
          cache: true
      - id: plan
        name: Pick sites
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          INPUT_SITE: ${{ inputs.site }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          all='["decentralised.dev","hugodias.me","ivs.legal"]'
          affected() {
            pnpm -s turbo ls --affected --output=json |
              jq -c '[.packages.items[].name]'
          }
          environment=production
          publish=false
          case "$EVENT" in
            pull_request)
              # The checkout has no local base branch for turbo to resolve
              # from GITHUB_BASE_REF, so it would assume every site changed.
              sites=$(TURBO_SCM_BASE=$PR_BASE_SHA affected)
              environment=preview
              publish=$SAME_REPO
              ;;
            push)
              # Diff against the last successful push run, so changes from a
              # failed or cancelled run still deploy.
              base=$(gh run list --workflow ci.yml --branch master --event push \
                --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
              if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
                sites=$(TURBO_SCM_BASE=$base affected)
              else
                sites=$all
              fi
              publish=true
              ;;
            repository_dispatch)
              case "$ACTION" in
                webhook) sites='["decentralised.dev","hugodias.me"]' ;;
                ivs-legal-webhook) sites='["ivs.legal"]' ;;
              esac
              publish=true
              ;;
            workflow_dispatch)
              if [ "$INPUT_SITE" = all ]; then
                sites=$all
              else
                sites=$(jq -cn --arg site "$INPUT_SITE" '[$site]')
              fi
              environment=$INPUT_ENVIRONMENT
              if [ "$GITHUB_REF" = refs/heads/master ] || [ "$environment" = staging ]; then
                publish=true
              fi
              ;;
          esac
          {
            echo "sites=$sites"
            echo "environment=$environment"
            echo "publish=$publish"
          } | tee -a "$GITHUB_OUTPUT"

  site:
    name: ${{ matrix.site }}
    needs: plan
    if: needs.plan.outputs.sites != '[]'
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    uses: ./.github/workflows/site.yml
    with:
      site: ${{ matrix.site }}
      environment: ${{ needs.plan.outputs.environment }}
      publish: ${{ needs.plan.outputs.publish == 'true' }}
    secrets: inherit

  comment:
    name: Comment previews
    needs: [plan, site]
    if: ${{ !cancelled() && needs.plan.outputs.environment == 'preview' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.sites != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: preview-*
          path: previews
      - name: Upsert pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SITES: ${{ needs.plan.outputs.sites }}
        run: |
          marker='<!-- worker-previews -->'
          {
            echo "$marker"
            echo '### Worker Previews'
            echo
            echo '| Site | Preview | This commit |'
            echo '| --- | --- | --- |'
            for site in $(jq -r '.[]' <<< "$SITES"); do
              file="previews/preview-$site/preview.json"
              if [ -f "$file" ]; then
                jq -r '"| \(.site) | \(.url) | \(.deployment_url) |"' "$file"
              else
                echo "| $site | Failed, see the run logs | |"
              fi
            done
            echo
            echo "Built from $SHA. Previews are public and are deleted when this pull request closes."
          } > comment.md
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

  cleanup:
    name: Delete previews
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - name: Delete Worker Previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          # A site the pull request never touched has no Preview to delete.
          for dir in packages/*/; do
            (cd "$dir" && pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation) ||
              echo "::notice::No $PREVIEW_NAME Preview deleted for $dir"
          done
